.fl-strip .fl-cell.s.neg { background: rgba(252,98,85,.14); }
.fl-strip .fl-cell.prod { background: rgba(247,220,95,.12); color: #fff3b8; }
.fl-strip .fl-cell.prod.neg { background: rgba(252,98,85,.2); color: #ffd0c8; }
.fl-strip .fl-cell.gapc { background: none; color: #8f98a8; }
.fl-slbl { position: absolute; left: 0; display: flex; align-items: center; justify-content: flex-end; font: italic 15px var(--vz-serif); color: var(--vz-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-slbl.r1 { color: var(--vz-teal); }
.fl-slbl.r2 { color: #c9b458; font: 500 11px system-ui, sans-serif; }
.fl-times { position: absolute; color: var(--vz-dim); font: 16px var(--vz-serif); }
.fl-wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.fl-wires line { stroke: #f7dc5f; stroke-width: 1.3; opacity: 0; transition: opacity .25s; }
.fl-wires line.on { opacity: .55; }
.fl-sum { position: absolute; text-align: center; font: 21px var(--vz-serif); color: #dfe6ef; white-space: nowrap; }
.fl-sum .sig { color: var(--vz-yellow); font-size: 24px; }
.fl-sum b { display: inline-block; color: var(--vz-yellow); font-weight: 600; text-shadow: 0 0 10px #f7dc5f77; }
.fl-sum b.neg { color: #ffb199; }
.fl-sum small { font: 500 11px system-ui, sans-serif; color: var(--vz-dim); margin-left: 10px; }

.fl-gate { position: absolute; left: 0; top: 0; border: 2px solid rgba(92,208,179,.75); border-radius: 12px; background: rgba(92,208,179,.07); box-shadow: 0 0 30px rgba(92,208,179,.18); box-sizing: border-box; pointer-events: none; }
.fl-ghead { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; pointer-events: none; }
.fl-ghead b { font: 600 27px var(--vz-serif); color: var(--vz-teal); }
.fl-op { animation: fl-opin .45s ease-out; }
@keyframes fl-opin { from { opacity: 0; } to { opacity: 1; } }
.fl-ghead span { font: italic 16px var(--vz-serif); color: #b9c8d6; }
.fl-plot { background: rgba(0,0,0,.35); border-radius: 6px; }
.fl-plot .ax { stroke: #5d6676; stroke-width: 1; }
.fl-plot .fx { fill: none; stroke: var(--vz-teal); stroke-width: 2.2; }

/* the list of steps you can edit */
.fl-drawer { width: 244px; flex: none; background: #10141c; border-left: 1px solid var(--vz-line); overflow-y: auto; overflow-x: hidden; font-size: 12.5px; color: #cfd6e2; user-select: none; }
#vizpanel.nodrawer .fl-drawer, #vizpanel.slim:not(.full) .fl-drawer { display: none; }
.fl-dhead { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; }
.fl-dhead b { flex: 1; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #aeb6c3; }
html #vizpanel .fl-drawer button { background: #222835; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; }
html #vizpanel .fl-drawer button:hover { background: #2c3445; }
html #vizpanel .fl-drawer select { background: #1a1f2a; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 6px; padding: 2px 3px; font: inherit; max-width: 100%; color-scheme: dark; }
.fl-dnote { padding: 2px 10px 8px; color: var(--vz-dim); line-height: 1.45; }
.fl-dnote.warn { color: #f3c965; }
/* the stage above, the map of the whole calculation beneath */
.fl-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fl-stage { flex: 1; min-height: 0; position: relative; display: flex; }
.fl-map { position: relative; flex: none; height: 110px; background: #0b0f17; border-top: 1px solid var(--vz-line); overflow: hidden; user-select: none; }
.fl-map.empty, #vizpanel.nomap .fl-map { display: none; }
.fl-sb { position: absolute; box-sizing: border-box; border-radius: 6px; padding: 3px 6px 2px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 1px;
  background: #5cd0b322; border: 1px solid #5cd0b377; color: #e8f6f1; transition: background .15s, border-color .15s; }
.fl-sb.mul { background: #58c4dd24; border-color: #58c4dd88; color: #e6f6fb; }
.fl-sb.move { background: #8f98a824; border-color: #8f98a888; color: #e3e7ee; }
.fl-sb.look { background: #f7dc5f20; border-color: #f7dc5f88; color: #fbf3cc; }
.fl-sb.bad { background: #fc625526; border-color: #fc6255; }
.fl-sb small { font: 500 9.5px system-ui, sans-serif; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-sb small em { font-style: normal; font-weight: 700; color: var(--vz-blue); }
.fl-sb b { font: italic 600 13px var(--vz-serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-sb.slim { padding: 0 5px; } .fl-sb.slim b { font-size: 11.5px; }
.fl-sb i { position: absolute; right: 4px; top: 2px; font: 700 10px system-ui, sans-serif; font-style: normal; }
.fl-sb i.ok { color: var(--vz-green); } .fl-sb i.no { color: var(--vz-red); }
.fl-sb:hover, .fl-sb.hov { background: #ffffff26; border-color: #fff; }
.fl-sb.now { background: #f7dc5f38; border-color: var(--vz-yellow); box-shadow: 0 0 0 1px var(--vz-yellow), 0 0 14px #f7dc5f55; color: #fff; }
.fl-sb.part { background: #1a2030; border-color: #36405a; color: #e6ebf3; padding: 4px 9px; justify-content: flex-start; }
.fl-sb.part b { font: 600 13px system-ui, sans-serif; white-space: normal; }
.fl-sb.part.on { border-color: var(--vz-blue); background: #1d2a44; }
.fl-sb.part:hover, .fl-sb.part.hov { border-color: #fff; background: #26304a; }
.fl-sb.part.now { border-color: var(--vz-yellow); }
.fl-maphead { position: absolute; width: 150px; box-sizing: border-box; padding: 4px 8px; border-radius: 6px; background: #151b28; border: 1px solid #2a3244; display: flex; flex-direction: column; gap: 2px; }
.fl-maphead small { font: 500 9.5px system-ui, sans-serif; color: var(--vz-dim); }
.fl-maphead b { font: 600 12.5px system-ui, sans-serif; color: #e6ebf3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fl-maphead span { margin-top: auto; display: flex; gap: 4px; }
html #vizpanel .fl-maphead button { flex: 1; background: #222835; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 5px; padding: 0; height: 20px; cursor: pointer; font: 14px/1 system-ui, sans-serif; }
html #vizpanel .fl-maphead button:disabled { opacity: .3; cursor: default; }
.fl-maplegend { position: absolute; left: 10px; right: 10px; bottom: 3px; display: flex; gap: 12px; font: 10px system-ui, sans-serif; color: var(--vz-dim); pointer-events: none; white-space: nowrap; overflow: hidden; }
.fl-maplegend .note { margin-left: auto; opacity: .85; }
.fl-maplegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.fl-maplegend i.mul { background: #58c4dd; } .fl-maplegend i.fn { background: #5cd0b3; } .fl-maplegend i.move { background: #8f98a8; } .fl-maplegend i.look { background: #f7dc5f; }
.fl-shead .t em.par { font: 600 10.5px system-ui, sans-serif; color: var(--vz-blue); margin-left: 6px; }
.fl-sec { display: flex; align-items: baseline; gap: 6px; margin: 2px 8px 6px; padding: 6px 8px; border-radius: 8px; background: #1a2030; border: 1px solid #2a3244; cursor: pointer; }
.fl-sec:hover { background: #222a3c; }
.fl-sec.on { border-color: #4a6aa8; background: #1d2740; }
.fl-sec b { flex: 1; min-width: 0; font: 600 12.5px system-ui, sans-serif; color: #e6ebf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-sec small { color: var(--vz-dim); font-size: 11px; white-space: nowrap; }
.fl-sec .a { color: var(--vz-dim); width: 10px; }
.fl-sec .no { color: var(--vz-red); font-weight: 700; }
.fl-step { margin: 0 8px 7px; border: 1px solid #262c38; border-radius: 9px; background: #151a24; }
.fl-step.now { border-color: var(--vz-yellow); box-shadow: 0 0 0 1px #f7dc5f44; }
.fl-step.bad { border-color: #8a3a44; }
.fl-shead { display: flex; align-items: center; gap: 7px; padding: 7px 9px; cursor: pointer; }
.fl-shead .n { width: 18px; height: 18px; border-radius: 50%; background: #27406b; color: #fff; font: 600 11px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; flex: none; }
.fl-shead .t { flex: 1; min-width: 0; font: italic 15px var(--vz-serif); color: #eef2f7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-shead .t small { display: block; font: 500 11px system-ui, sans-serif; color: var(--vz-dim); overflow: hidden; text-overflow: ellipsis; }
.fl-shead .ok { color: var(--vz-green); font-weight: 700; }
.fl-shead .no { color: var(--vz-red); font-weight: 700; }
.fl-sbody { padding: 6px 9px 9px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 5px 6px; align-items: center; border-top: 1px solid #222835; }
.fl-sbody > select { width: 100%; min-width: 0; }
.fl-sbody label { color: var(--vz-dim); }
.fl-sbody .row { display: flex; gap: 5px; align-items: center; min-width: 0; }
.fl-sbody .row select { flex: 1; min-width: 0; }
.fl-sbody .err { grid-column: 1 / -1; color: #ff9aa3; line-height: 1.4; overflow-wrap: anywhere; }
.fl-sbody .acts { grid-column: 1 / -1; display: flex; gap: 5px; justify-content: flex-end; }
.fl-add { margin: 2px 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- 3.6: finished steps step back; hover lights one up, a click brings it back */
.fl-plate.away, .fl-plate.away .fl-cell { cursor: pointer; }
.fl-plate.peek { opacity: .95 !important; }
.fl-plate.peek .fl-face.front { border-color: var(--vz-blue); box-shadow: 0 0 0 2px rgba(88,196,221,.85), 0 0 34px rgba(88,196,221,.45); }
.fl-plate.peek .fl-title b { color: #dff4fa; }
.fl-view.canpick { cursor: pointer; }
.fl-op { transition: opacity .35s; }
.fl-op.away { opacity: .2; }
.fl-line.rel.away { opacity: .05; }

/* ---- on the stage: back to the map, follow again, steering buttons */
.fl-stage > button, .fl-nav button { font: 500 12.5px system-ui, sans-serif; background: #1b2130e8; color: #dfe5ee; border: 1px solid #36405a; border-radius: 8px; cursor: pointer; }
.fl-stage > button:hover, .fl-nav button:hover { background: #2a3550; border-color: #5b78b8; }
.fl-back { position: absolute; left: 12px; top: 12px; z-index: 6; padding: 6px 12px; display: none; box-shadow: 0 4px 18px #0008; }
.vz-flowwrap.in-part .fl-back { display: block; }
html #vizpanel .fl-back { background: #27406b; border-color: #4c8dff; color: #fff; font-weight: 600; }
.fl-follow { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 6; padding: 4px 11px; display: none; }
.vz-flowwrap.steered .fl-follow { display: block; }
.fl-nav { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 4px; opacity: .55; transition: opacity .2s; }
.fl-nav:hover { opacity: 1; }
.fl-nav button { width: 30px; height: 30px; padding: 0; font-size: 15px; line-height: 1; }
.fl-nav i { height: 5px; }
html.touch .fl-nav { opacity: .9; } html.touch .fl-nav button { width: 38px; height: 38px; }
.vz-flowwrap.frozen .fl-view { box-shadow: inset 0 0 0 2px #7fd6ff66, inset 0 0 60px #7fd6ff14; }
.vz-flowwrap.frozen .fl-shead { cursor: zoom-in; }

/* ---- the words under the picture, and your own */
.fl-cap { padding-left: 54px; padding-right: 54px; }
.fl-cap .own { pointer-events: auto; cursor: text; font-size: 21px; color: #fff3c4; white-space: pre-wrap; max-width: 980px; margin: 0 auto 3px; line-height: 1.3; }
.fl-cap .own:hover { text-decoration: underline dotted #f7dc5f88; text-underline-offset: 5px; }
.fl-cap .auto.small { font-size: 14.5px; color: #aeb7c6; }
html #vizpanel .fl-cap .pen { pointer-events: auto; margin-left: 12px; padding: 1px 8px; font: 500 11.5px system-ui, sans-serif; background: #222835; color: #c9d2e0; border: 1px solid #36405a; border-radius: 10px; cursor: pointer; opacity: .6; vertical-align: 2px; }
html #vizpanel .fl-cap .pen:hover { opacity: 1; border-color: #f7dc5f; color: #fff; }
.fl-cap .edit { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; justify-content: center; }
.fl-cap .edit .k { margin-top: 9px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-cap textarea, .fl-own textarea { font: 16px var(--vz-serif); background: #0d1119; color: #fff; border: 1px solid #f7dc5f; border-radius: 8px; padding: 6px 9px; resize: vertical; color-scheme: dark; outline: none; }
.fl-cap textarea { width: min(760px, 78%); }
.fl-own { padding: 0 9px 7px 34px; font: italic 13px var(--vz-serif); color: #f1e6b0; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; }
.fl-own.none { display: none; font: 500 11px system-ui, sans-serif; color: #6f7a8d; }
.fl-step:hover .fl-own.none, .fl-step.now .fl-own.none { display: block; }
.fl-own.none:hover { color: #f7dc5f; }
.fl-own textarea { width: 100%; box-sizing: border-box; font-size: 13.5px; }
.fl-own .edit .k { display: none; }
.fl-sec.live { border-color: var(--vz-yellow); }

/* ---- the program's Buttons, in the visualizer */
.vz-btns { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: #10141c; border-bottom: 1px solid var(--vz-line); overflow-x: auto; flex: none; scrollbar-width: thin; }
#vizpanel.nobtns .vz-btns { display: none; }
.vz-btns .lbl { font: 600 10.5px system-ui, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--vz-dim); margin-right: 2px; }
.vz-btns .none { font-size: 12px; color: var(--vz-dim); }
html #vizpanel .vz-btns button { background: #18301f; color: #d9f5e3; border: 1px solid #2f6b48; border-radius: 14px; padding: 3px 12px 3px 8px; white-space: nowrap; cursor: pointer; font: inherit; flex: none; }
html #vizpanel .vz-btns button:hover:not(:disabled) { background: #20452c; border-color: #49a36d; }
html #vizpanel .vz-btns button i { font-style: normal; color: #5ee08f; margin-right: 6px; font-size: 10px; }
html #vizpanel .vz-btns button:disabled { opacity: .4; cursor: default; }
html #vizpanel .vz-btns button.run { border-color: #5ee08f; box-shadow: 0 0 0 2px #5ee08f44; animation: vzbtn 1s ease-in-out infinite alternate; }
html #vizpanel .vz-btns button.stop { background: #3a1c20; border-color: #8a3a44; color: #ffd7d7; padding-left: 10px; }
@keyframes vzbtn { from { box-shadow: 0 0 0 1px #5ee08f33; } to { box-shadow: 0 0 0 4px #5ee08f55; } }
html.touch #vizpanel .vz-btns button { padding: 6px 14px 6px 10px; }

/* ---- the map in space: parts as glass boxes, steps as blocks */
.fl-box, .fl-part, .fl-slab { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.fl-box > i { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; box-sizing: border-box; }
.fl-glass > i { background: rgba(190,210,255,.03); border: 2px solid rgba(190,210,255,.2); pointer-events: none; transition: border-color .2s, background .2s; }
.fl-glass > i.far { pointer-events: auto; background: rgba(190,210,255,.045); }
.fl-part { cursor: pointer; }
.fl-part:hover .fl-glass > i { border-color: rgba(200,220,255,.6); background: rgba(190,210,255,.07); }
.fl-part.on .fl-glass > i { border-color: var(--vz-blue); background: rgba(88,196,221,.08); }
.fl-part.live .fl-glass > i { border-color: var(--vz-yellow); background: rgba(247,220,95,.07); }
.fl-part.bad .fl-glass > i { border-color: #b0505c; }
.fl-plabel { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; pointer-events: auto; cursor: pointer; }
.fl-plabel b { display: block; font: 600 62px var(--vz-serif); color: #eef2f7; text-shadow: 0 2px 14px #000; }
.fl-plabel small { display: block; font: 500 34px system-ui, sans-serif; color: #9aa6b8; margin-top: 4px; }
.fl-plabel em { position: absolute; right: -44px; top: 0; font: 700 54px system-ui, sans-serif; color: var(--vz-red); }
.fl-part:hover .fl-plabel b, .fl-part.on .fl-plabel b { color: #fff; }
.fl-part.on .fl-plabel small { color: var(--vz-blue); }
.fl-slab > .fl-box > i { background: #5cd0b3; border: 1px solid #0006; transition: opacity .25s, background .2s; }
.fl-slab.mul > .fl-box > i { background: #58c4dd; }
.fl-slab.move > .fl-box > i { background: #8f98a8; }
.fl-slab.look > .fl-box > i { background: #f7dc5f; }
.fl-slab.bad > .fl-box > i { background: #fc6255; }
.fl-slab > .fl-box > i.sd { box-shadow: inset 0 0 0 999px rgba(0,0,0,.22); }
.fl-slab > .fl-box > i.bk { box-shadow: inset 0 0 0 999px rgba(0,0,0,.34); }
.fl-slab > .fl-box > i.tp { box-shadow: inset 0 0 0 999px rgba(255,255,255,.14); }
.fl-slab.todo > .fl-box > i { opacity: .16; }
.fl-slab.now > .fl-box > i { background: #fff; box-shadow: 0 0 46px #fff; opacity: 1; }
.fl-line.stream { background: #9fb4c9; opacity: .55; height: 6px; margin-top: -3px; }
.fl-line.skip { background: #f7dc5f; opacity: .75; height: 5px; margin-top: -2.5px; }
.fl-line.lead { background: #9aa6b8; opacity: .35; height: 2px; }
html #vizpanel .fl-shead button { padding: 1px 5px; min-width: 0; font-size: 12px; opacity: .75; }
html #vizpanel .fl-shead button:hover { opacity: 1; }
.fl-drawer { width: 256px; }

/* ---- 3.7: numbers only where they can be read; the rest keeps its colours */
.fl-plate.nonum .fl-cell { font-size: 0; color: transparent; border-radius: 2px; background: rgba(88,196,221, calc(var(--h, 0) * .72 + .06)); transition: none; }
.fl-plate.nonum .fl-cell.neg { background: rgba(252,98,85, calc(var(--h, 0) * .72 + .06)); }
.fl-plate.nonum .fl-cell.pend { background: rgba(255,255,255,.04); }
.fl-plate.nonum .fl-ix, .fl-plate.nonum .fl-gap { visibility: hidden; }
.fl-part:hover .fl-plabel b, .fl-part.hov .fl-plabel b { color: #fff; }
.fl-part.hov .fl-glass > i { border-color: rgba(200,220,255,.75); background: rgba(190,210,255,.09); }

/* ---- performance mode in the visualizer: flat plates, no glows, nothing animated that doesn't have to be */
#vizpanel.lean .fl-side, #vizpanel.lean .fl-face.back { display: none; }
#vizpanel.lean .fl-cell, #vizpanel.lean .fl-op, #vizpanel.lean .fl-sb { transition: none; }
#vizpanel.lean .fl-cell.src, #vizpanel.lean .fl-cell.hot, #vizpanel.lean .fl-gate, #vizpanel.lean .fl-plate.peek .fl-face.front { box-shadow: 0 0 0 2px var(--vz-blue); }
#vizpanel.lean .fl-cell.hot { box-shadow: 0 0 0 2px var(--vz-yellow); }
#vizpanel.lean .fl-plabel b { text-shadow: none; }
#vizpanel.lean .fl-slab > .fl-box > i.far, #vizpanel.lean .fl-slab.now > .fl-box > i { box-shadow: none; }
#vizpanel.lean .fl-slab > .fl-box > i.far { display: none; }
#vizpanel.lean .fl-view { background: #080b11; }

/* ---- 3.7: pictures and feature maps (a CNN): every number is a pixel */
.fl-pic .fl-face.front { background: #05070b; border-color: rgba(255,255,255,.34); cursor: crosshair; }
.fl-pic.res .fl-face.front { background: #05070b; border-color: rgba(247,220,95,.6); }
.fl-pix { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
.fl-pgrid { position: absolute; pointer-events: none; opacity: .5; background-image: linear-gradient(to right, rgba(255,255,255,.09) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.09) 1px, transparent 1px); }
.fl-pk { position: absolute; width: 0; height: 0; pointer-events: none; }
.fl-plate.nonum .fl-pgrid { display: none; }
.fl-cell.best { box-shadow: 0 0 0 2px var(--vz-yellow), 0 0 16px #f7dc5f66; color: #fff; font-weight: 600; }
/* the window that slides over a picture, the place it writes to, and the zeros put around the picture */
.fl-win { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 2.5px solid var(--vz-yellow); border-radius: 2px; background: rgba(247,220,95,.16); box-shadow: 0 0 16px rgba(247,220,95,.6); pointer-events: none; }
.fl-win.one { border-width: 2px; background: rgba(247,220,95,.3); }
.fl-win.row { border-width: 1.5px; border-color: var(--vz-teal); background: rgba(92,208,179,.22); box-shadow: 0 0 12px rgba(92,208,179,.5); }
.fl-ring { position: absolute; left: 0; top: 0; box-sizing: border-box; border-style: solid; border-color: rgba(88,196,221,.2); outline: 1.5px dashed rgba(88,196,221,.75); outline-offset: -1px; pointer-events: none; }
.fl-ring::before { content: 'padding: zeros around the picture'; position: absolute; left: 0; top: 100%; margin: 7px 0 0 -2px; font: italic 13px var(--vz-serif); color: var(--vz-blue); white-space: nowrap; }
/* the worked example above the picture */
.fl-lens { position: absolute; left: 0; top: 0; box-sizing: border-box; background: rgba(8,11,18,.95); border: 1px solid rgba(247,220,95,.5); border-radius: 10px; box-shadow: 0 0 34px rgba(247,220,95,.14); font-family: var(--vz-serif); color: #ececec; pointer-events: none; }
.fl-lens .grp { position: absolute; }
.fl-lens .grp small { position: absolute; left: 0; top: 4px; width: 100%; text-align: center; font: 500 12.5px system-ui, sans-serif; color: var(--vz-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-lens .grp.k small { color: var(--vz-teal); }
.fl-lens .grp.p small { color: var(--vz-yellow); }
.fl-lens .c { position: absolute; display: flex; align-items: center; justify-content: center; font: 17px var(--vz-serif); font-variant-numeric: tabular-nums; border-radius: 4px; background: rgba(88,196,221,.14); color: #f1f1f1; }
.fl-lens .c.neg { background: rgba(252,98,85,.2); color: #ffd9d4; }
.fl-lens .grp.k .c { background: rgba(92,208,179,.16); }
.fl-lens .grp.k .c.neg { background: rgba(252,98,85,.2); }
.fl-lens .grp.p .c { background: rgba(247,220,95,.13); }
.fl-lens .grp.p .c.neg { background: rgba(252,98,85,.2); }
.fl-lens .c.best { box-shadow: 0 0 0 2px var(--vz-yellow); color: #fff; }
.fl-lens .op { position: absolute; width: 26px; text-align: center; font: 22px var(--vz-serif); color: #b9c8d6; }
.fl-lens .sum { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; font: 19px var(--vz-serif); white-space: nowrap; }
.fl-lens .sum .sig { font-size: 22px; color: var(--vz-yellow); }
.fl-lens .sum .more { font: italic 15.5px var(--vz-serif); color: #b9c8d6; }
.fl-lens .sum .res b { font-size: 21px; color: var(--vz-yellow); }
#vizpanel.lean .fl-win, #vizpanel.lean .fl-lens { box-shadow: none; }
/* the program's Draw Pad on the Flow stage, and what the network makes of the drawing */
.fl-pad { position: absolute; left: 12px; top: 12px; z-index: 6; width: 196px; background: rgba(13,17,25,.94); border: 1px solid #36405a; border-radius: 10px; box-shadow: 0 6px 24px #000a; color: #dfe5ee; font: 12.5px system-ui, sans-serif; }
.vz-flowwrap.in-part .fl-pad { top: 52px; }
.fl-pad.shut { width: auto; }
.fl-padin { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
.fl-pad.shut .fl-padin { padding: 5px 8px; }
.fl-padhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.fl-padhead b { font-weight: 600; color: #fff3c4; }
html #vizpanel .fl-padhead button { min-width: 0; width: 22px; height: 20px; padding: 0; line-height: 1; font-size: 14px; border-radius: 6px; }
.fl-pad .pad { padding: 0; }
.fl-pad .pad-cv { border-color: #f7dc5f99; }
html #vizpanel .fl-pad .pad-tools button { min-width: 0; font-size: 11px; padding: 2px 7px; }
html #vizpanel .fl-pad .pad-tools button.on { background: #2f6f93; border-color: #58c4dd; color: #fff; }
.fl-bars { display: flex; flex-direction: column; gap: 2px; }
.fl-guess { font: 15px var(--vz-serif); color: #cfd6e2; margin: 1px 0 4px; }
.fl-guess b { font: 600 26px var(--vz-serif); color: var(--vz-yellow); margin: 0 2px; }
.fl-bar { display: grid; grid-template-columns: 12px 1fr 44px; align-items: center; gap: 6px; height: 15px; font-variant-numeric: tabular-nums; }
.fl-bar span { font: 600 12px var(--vz-serif); color: #aeb7c6; text-align: center; }
.fl-bar i { height: 9px; background: #1c2230; border-radius: 3px; overflow: hidden; }
.fl-bar u { display: block; height: 100%; background: var(--vz-blue); border-radius: 3px; text-decoration: none; transition: width .12s linear; }
.fl-bar em { font: 11px system-ui, sans-serif; color: #8f9aad; text-align: right; font-style: normal; }
.fl-bar.top span, .fl-bar.top em { color: var(--vz-yellow); }
.fl-bar.top u { background: var(--vz-yellow); }
.fl-bars small, .fl-barnote { font-size: 11px; line-height: 1.35; color: #8f9aad; margin-top: 4px; }
#vizpanel.lean .fl-bar u { transition: none; }
#vizpanel.lean .fl-pad { box-shadow: none; }
html #vizpanel .fl-pad .pad-tools { gap: 3px; }
html #vizpanel .fl-pad .pad-tools button { white-space: nowrap; padding: 2px 5px; font-size: 10.5px; letter-spacing: -.1px; }
/* a 1 × 1 convolution worked out: one row per map */
.fl-lens .rl { position: absolute; display: flex; align-items: center; justify-content: flex-end; font: italic 13.5px var(--vz-serif); color: var(--vz-blue); white-space: nowrap; }
/* a list that is put up again further on: an arc from where it first stood (the way around the steps between: a skip) */
.fl-line.rel.arc { background: var(--vz-yellow); opacity: .5; height: 2px; }
.fl-line.rel.arc.away { opacity: .08; }

button.mini { padding: 0 7px; line-height: 18px; }
.pad { display: flex; flex-direction: column; gap: 5px; align-items: center; padding: 2px 0 4px; }
.pad-cv { image-rendering: pixelated; image-rendering: crisp-edges; background: #000; border: 1.5px solid #4a5160; border-radius: 4px; cursor: crosshair; touch-action: none; display: block; }
.pad-tools { display: flex; gap: 4px; }
.pad-tools button.mini { font-size: 11px; padding: 2px 6px; white-space: nowrap; }
.pad-tools button.mini.on { background: var(--accent); border-color: var(--accent); color: #fff; }
/* A Flow page's own few rules (the rest is viz.css, as in the app). */
#nf-page { position: fixed; inset: 0; }
#vizpanel .fl-pad .nf-row { display: flex; gap: 5px; flex-wrap: wrap; }
html #vizpanel .fl-pad .nf-row button { min-width: 0; padding: 3px 8px; font-size: 11.5px; border-radius: 7px; background: #222835; color: #dfe5ee; border: 1px solid #323a4a; }
html #vizpanel .fl-pad .nf-row button:hover:not(:disabled) { background: #2c3445; }
#vizpanel .fl-pad label { font: 600 10.5px system-ui, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--vz-dim); }
#vizpanel .fl-pad textarea { width: 100%; min-height: 62px; resize: vertical; background: #0d1119; color: #fff; border: 1px solid #36405a; border-radius: 7px; padding: 6px 8px; outline: none; color-scheme: dark; font: 14px/1.35 system-ui, sans-serif; user-select: text; -webkit-user-select: text; }
#vizpanel .fl-pad textarea:focus { border-color: var(--vz-yellow); }
/* the text as the model sees it: one chip per token */
.nf-toks { display: flex; flex-wrap: wrap; gap: 3px; max-height: 92px; overflow-y: auto; }
.nf-toks span { font: 11px ui-monospace, Menlo, Consolas, monospace; white-space: pre; padding: 1px 4px; border-radius: 4px; background: #58c4dd22; border: 1px solid #58c4dd55; color: #e6f6fb; }
.nf-toks span:nth-child(even) { background: #5cd0b322; border-color: #5cd0b355; color: #e8f6f1; }
/* what comes next: bars with the tokens' text; a click adds that token */
.fl-bars.named .fl-bar { grid-template-columns: 70px 1fr 44px; }
.fl-bars.named .fl-bar span { text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: pre; font: 500 11px ui-monospace, Menlo, Consolas, monospace; }
.fl-bars.named .fl-bar.pick { cursor: pointer; border-radius: 4px; }
.fl-bars.named .fl-bar.pick:hover { background: #ffffff14; }
.nf-fail { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 30px; color: #cfd6e2; font: 15px/1.6 system-ui, sans-serif; }

</style>

  // ------------------------------------------------------------ small drawing tools
  /** A straight line between two points in space (two crossed ribbons, so it shows from every side). */
  line(a, b, cls = '') {

    const len = Math.hypot(dx, dy, dz), hz = Math.hypot(dx, dz);
    const el = h('div', { class: 'fl-line ' + cls });

    el.style.width = len.toFixed(1) + 'px';
    el.style.transform = `translate3d(${a.x.toFixed(1)}px, ${a.y.toFixed(1)}px, ${a.z.toFixed(1)}px) rotateY(${Math.atan2(-dz, dx).toFixed(4)}rad) rotateZ(${Math.atan2(dy, hz).toFixed(4)}rad)`;

  async draw(a, b, cls, ms = 300, delay = 0) {

  /** Hovering a dimmed plate: its whole step glows, ready to be clicked. */

  describe(it) {

  /** Freeze-frame on one step: everything worked out, the light on that step, the camera on its result. */

    await this.settle();
    this.clearTemp();
    for (const x of this.plan) {
      if (x.card) x.card.style.opacity = '1';
      for (const ln of this.lanes(x)) for (const p of [...ln.ins, ln.out]) if (p) { this.show(p); this.revealAll(p); }

    this.held = it;

  // ------------------------------------------------------------ playing

  /** Play the steps from one of them on; earlier ones are shown finished. */
  async play(from = 0) {

    this.plan.forEach((it, n) => {

  /** Faint lines that stay: which row / cell each result came from. */

  }
  /** The way through a gate for one result cell: from its source cells to a point just short of the

  /** The sign a step leaves behind, saying what was done between its plates (one sign, also for a step done in every head). */

  cellsOf(plate) { const o = []; for (const i of plate.shownRows()) for (const j of plate.shownCols()) o.push([i, j]); return o; }

  // ---- matrix products: the strip
  /** What lines up for one result cell: the two rows of numbers, where they come from, and the answer. */

      default: return { K: A.length, side: 'col', top: list(PA, A, nA), bot: list(PB, B, nB), out: it.res.v, what: `${nA} lined up with ${nB}` };

  /** The work strip between the plates: two rows that line up, the products beneath, and their sum. */

    const xs = []; let x = LBL;
    for (const k of win) { xs.push(x); x += k < 0 ? GAPW : CW; }
    const W = x + 12, H = SUMY + 38;
    const el = h('div', { class: 'fl-strip', style: { width: W + 'px', height: H + 'px' } });
    const g = svg('svg', { width: W, height: H, class: 'fl-wires' });
    el.append(g);
    const rows = [0, 1, 2].map(() => []);
    const labels = [0, 1, 2].map((r) => { const l = h('span', { class: `fl-slbl r${r}`, style: { top: R[r] + 'px', width: LBL - 12 + 'px', height: CH + 'px' } }); el.append(l); return l; });
    el.append(h('span', { class: 'fl-times', style: { left: LBL - 30 + 'px', top: R[0] + CH - 6 + 'px' } }, '×'));

      for (let r = 0; r < 3; r++) {

        if (k < 0) c.classList.add('gapc');

      }

        const cx = xs[wi] + CW / 2;
        g.append(svg('line', { x1: cx, y1: R[1] + CH, x2: cx, y2: R[2] + 2, class: 'tick', 'data-k': wi }), svg('line', { x1: cx, y1: R[2] + CH - 2, x2: LBL + (x - LBL) / 2, y2: SUMY + 4, class: 'conv', 'data-k': wi }));
      }
    });

    const org = { x: under ? base.x + base.colX[0] - LBL : base.x + base.w / 2 - (LBL + (x - LBL) / 2), y: it.lane ? base.y - H - 64 : base.y + base.h + 46, z: base.z + 30 };      // in lanes: above the top one (another head stands beneath)

      sumPos: () => ({ x: org.x + LBL + (x - LBL) / 2, y: org.y + SUMY + 16, z: org.z + 1 }),

  }
  /** The travelling numbers leave their plate and line up right beside the numbers they multiply.

  async lineUp(pr, pace) {

    const pair = (el) => { el._pair = true; return this.keep(el); };
    const vis = windowOf(pr.K, 6, 1).filter((k) => k >= 0);
    for (const P of new Set([pr.top.plate, pr.bot.plate])) P.el.classList.add('pick');
    const hov = (k) => { const p = pr.bot.at(k); return pr.side === 'row' ? { x: p.x, y: p.y - CH * 0.66, z: p.z + 10 } : { x: p.x - CW * 0.8, y: p.y, z: p.z + 10 }; };

      : conv ? `${f}: a ${kh} × ${kw} kernel slides over ${c.C > 1 ? `all ${c.C} maps at once (it has a ${kh} × ${kw} layer for each)` : 'the picture'}${pd ? ` (with ${pd} row${pd === 1 ? '' : 's'} of zeros put around it)` : ''}. At every stop the numbers under it are multiplied by the kernel's numbers and added up${X.ins[2] ? ', plus the bias' : ''}${many}`

        : conv ? `stop ${n + 1} of ${total}: the ${kh * kw} numbers under the kernel × the kernel's ${kh * kw} numbers, added up${d.C > 1 ? ` — and the same in the other ${d.C - 1} maps, all into one sum` : ''}${d.bias !== null ? `, + bias` : ''} = ${fmt(d.total, 3)} → ${where}${edge}`

      const to = it.out.pos(i, j), t = this.keep(this.tok(fmt(d.total), lens.sumPos(), 'res' + tint(d.total)));

  /** A function on every pixel of every map (ReLU …): the maps pass through the gate and come out row by row. */
  async playWipe(it, ok) {
    const C = this.clock, all = this.lanes(it), out = it.out;
    this.mark(it);
    this.focus([...this.platesOf(it), it.op]);
    const name = this.mapName(it), f = formula(it.step, this.steps), relu = fnName(it.step.fn) === 'ReLU';
    this.say(name, `${f}: every pixel goes through on its own${relu ? ' — negative ones become 0 (black), the rest stay as they are' : ''}${all.length > 1 ? `, in all ${it.res.whole.lanes} maps` : ''}`);
    await C.sleep(500);
    const wins = all.map((ln) => [this.makeWindow(ln.ins.find(Boolean), 1, out.m, 'row'), this.makeWindow(ln.out, 1, out.m, 'row')]);

      for (const ln of all) ln.out.revealTo((i + 1) * out.m);
      await C.sleep(per);
      if (!ok()) return;

    for (const [a, b] of wins) { a.el.remove(); b.el.remove(); }

  /** Clicked a pixel of a picture: what is this number, and what made it? */

  /** Rows picked out of a table: each number goes to its row, and that row comes out. */

  /** Numbers that only move: rows taken from a table, columns dealt out to the heads or put back side by side. */

  // ------------------------------------------------------------ what is on show

  /** What to show: { steps, values, vocab?, words?, title?, map? }.

  // ------------------------------------------------------------ the words under the picture

  // ------------------------------------------------------------ the map and its parts
  /** The whole calculation as blocks (only for one that is in parts). */
