.fl-tok.fl-hov.neg { color: #ffc9c2; }
.fl-plate.pick .fl-cell:not(.src):not(.pend) { opacity: .34; }
.fl-plate .fl-cell { transition: opacity .25s; }

.fl-strip { position: absolute; left: 0; top: 0; background: rgba(8,11,18,.94); border: 1px solid rgba(88,196,221,.45); border-radius: 10px; box-shadow: 0 0 34px rgba(88,196,221,.14); font-family: var(--vz-serif); }
.fl-strip .fl-cell.s { font-size: 17px; background: rgba(255,255,255,.06); }
.fl-strip .fl-cell.s.neg { background: rgba(252,98,85,.14); }
.fl-strip .fl-cell.prod { background: rgba(247,220,95,.12); color: #fff3b8; }
.fl-strip .fl-cell.prod.neg { background: rgba(252,98,85,.2); color: #ffd0c8; }
.fl-strip .fl-cell.gapc { background: none; color: #8f98a8; }
.fl-slbl { position: absolute; left: 0; display: flex; align-items: center; justify-content: flex-end; font: italic 15px var(--vz-serif); color: var(--vz-blue); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-slbl.r1 { color: var(--vz-teal); }
.fl-slbl.r2 { color: #c9b458; font: 500 11px system-ui, sans-serif; }
.fl-times { position: absolute; color: var(--vz-dim); font: 16px var(--vz-serif); }
.fl-wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.fl-wires line { stroke: #f7dc5f; stroke-width: 1.3; opacity: 0; transition: opacity .25s; }
.fl-wires line.on { opacity: .55; }
.fl-sum { position: absolute; text-align: center; font: 21px var(--vz-serif); color: #dfe6ef; white-space: nowrap; }
.fl-sum .sig { color: var(--vz-yellow); font-size: 24px; }
.fl-sum b { display: inline-block; color: var(--vz-yellow); font-weight: 600; text-shadow: 0 0 10px #f7dc5f77; }
.fl-sum b.neg { color: #ffb199; }
.fl-sum small { font: 500 11px system-ui, sans-serif; color: var(--vz-dim); margin-left: 10px; }

.fl-gate { position: absolute; left: 0; top: 0; border: 2px solid rgba(92,208,179,.75); border-radius: 12px; background: rgba(92,208,179,.07); box-shadow: 0 0 30px rgba(92,208,179,.18); box-sizing: border-box; pointer-events: none; }
.fl-ghead { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; pointer-events: none; }
.fl-ghead b { font: 600 27px var(--vz-serif); color: var(--vz-teal); }
.fl-op { animation: fl-opin .45s ease-out; }
@keyframes fl-opin { from { opacity: 0; } to { opacity: 1; } }
.fl-ghead span { font: italic 16px var(--vz-serif); color: #b9c8d6; }
.fl-plot { background: rgba(0,0,0,.35); border-radius: 6px; }
.fl-plot .ax { stroke: #5d6676; stroke-width: 1; }
.fl-plot .fx { fill: none; stroke: var(--vz-teal); stroke-width: 2.2; }

/* the list of steps you can edit */
.fl-drawer { width: 244px; flex: none; background: #10141c; border-left: 1px solid var(--vz-line); overflow-y: auto; overflow-x: hidden; font-size: 12.5px; color: #cfd6e2; user-select: none; }
#vizpanel.nodrawer .fl-drawer, #vizpanel.slim:not(.full) .fl-drawer { display: none; }
.fl-dhead { display: flex; align-items: center; gap: 6px; padding: 8px 10px 6px; }
.fl-dhead b { flex: 1; font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: #aeb6c3; }
html #vizpanel .fl-drawer button { background: #222835; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 6px; padding: 2px 8px; cursor: pointer; font: inherit; }
html #vizpanel .fl-drawer button:hover { background: #2c3445; }
html #vizpanel .fl-drawer select { background: #1a1f2a; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 6px; padding: 2px 3px; font: inherit; max-width: 100%; color-scheme: dark; }
.fl-dnote { padding: 2px 10px 8px; color: var(--vz-dim); line-height: 1.45; }
.fl-dnote.warn { color: #f3c965; }
/* the stage above, the map of the whole calculation beneath */
.fl-left { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.fl-stage { flex: 1; min-height: 0; position: relative; display: flex; }
.fl-map { position: relative; flex: none; height: 110px; background: #0b0f17; border-top: 1px solid var(--vz-line); overflow: hidden; user-select: none; }
.fl-map.empty, #vizpanel.nomap .fl-map { display: none; }
.fl-sb { position: absolute; box-sizing: border-box; border-radius: 6px; padding: 3px 6px 2px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 1px;
  background: #5cd0b322; border: 1px solid #5cd0b377; color: #e8f6f1; transition: background .15s, border-color .15s; }
.fl-sb.mul { background: #58c4dd24; border-color: #58c4dd88; color: #e6f6fb; }
.fl-sb.move { background: #8f98a824; border-color: #8f98a888; color: #e3e7ee; }
.fl-sb.look { background: #f7dc5f20; border-color: #f7dc5f88; color: #fbf3cc; }
.fl-sb.bad { background: #fc625526; border-color: #fc6255; }
.fl-sb small { font: 500 9.5px system-ui, sans-serif; opacity: .72; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-sb small em { font-style: normal; font-weight: 700; color: var(--vz-blue); }
.fl-sb b { font: italic 600 13px var(--vz-serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-sb.slim { padding: 0 5px; } .fl-sb.slim b { font-size: 11.5px; }
.fl-sb i { position: absolute; right: 4px; top: 2px; font: 700 10px system-ui, sans-serif; font-style: normal; }
.fl-sb i.ok { color: var(--vz-green); } .fl-sb i.no { color: var(--vz-red); }
.fl-sb:hover, .fl-sb.hov { background: #ffffff26; border-color: #fff; }
.fl-sb.now { background: #f7dc5f38; border-color: var(--vz-yellow); box-shadow: 0 0 0 1px var(--vz-yellow), 0 0 14px #f7dc5f55; color: #fff; }
.fl-sb.part { background: #1a2030; border-color: #36405a; color: #e6ebf3; padding: 4px 9px; justify-content: flex-start; }
.fl-sb.part b { font: 600 13px system-ui, sans-serif; white-space: normal; }
.fl-sb.part.on { border-color: var(--vz-blue); background: #1d2a44; }
.fl-sb.part:hover, .fl-sb.part.hov { border-color: #fff; background: #26304a; }
.fl-sb.part.now { border-color: var(--vz-yellow); }
.fl-maphead { position: absolute; width: 150px; box-sizing: border-box; padding: 4px 8px; border-radius: 6px; background: #151b28; border: 1px solid #2a3244; display: flex; flex-direction: column; gap: 2px; }
.fl-maphead small { font: 500 9.5px system-ui, sans-serif; color: var(--vz-dim); }
.fl-maphead b { font: 600 12.5px system-ui, sans-serif; color: #e6ebf3; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.fl-maphead span { margin-top: auto; display: flex; gap: 4px; }
html #vizpanel .fl-maphead button { flex: 1; background: #222835; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 5px; padding: 0; height: 20px; cursor: pointer; font: 14px/1 system-ui, sans-serif; }
html #vizpanel .fl-maphead button:disabled { opacity: .3; cursor: default; }
.fl-maplegend { position: absolute; left: 10px; right: 10px; bottom: 3px; display: flex; gap: 12px; font: 10px system-ui, sans-serif; color: var(--vz-dim); pointer-events: none; white-space: nowrap; overflow: hidden; }
.fl-maplegend .note { margin-left: auto; opacity: .85; }
.fl-maplegend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.fl-maplegend i.mul { background: #58c4dd; } .fl-maplegend i.fn { background: #5cd0b3; } .fl-maplegend i.move { background: #8f98a8; } .fl-maplegend i.look { background: #f7dc5f; }
.fl-shead .t em.par { font: 600 10.5px system-ui, sans-serif; color: var(--vz-blue); margin-left: 6px; }
.fl-sec { display: flex; align-items: baseline; gap: 6px; margin: 2px 8px 6px; padding: 6px 8px; border-radius: 8px; background: #1a2030; border: 1px solid #2a3244; cursor: pointer; }
.fl-sec:hover { background: #222a3c; }
.fl-sec.on { border-color: #4a6aa8; background: #1d2740; }
.fl-sec b { flex: 1; min-width: 0; font: 600 12.5px system-ui, sans-serif; color: #e6ebf3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-sec small { color: var(--vz-dim); font-size: 11px; white-space: nowrap; }
.fl-sec .a { color: var(--vz-dim); width: 10px; }
.fl-sec .no { color: var(--vz-red); font-weight: 700; }
.fl-step { margin: 0 8px 7px; border: 1px solid #262c38; border-radius: 9px; background: #151a24; }
.fl-step.now { border-color: var(--vz-yellow); box-shadow: 0 0 0 1px #f7dc5f44; }
.fl-step.bad { border-color: #8a3a44; }
.fl-shead { display: flex; align-items: center; gap: 7px; padding: 7px 9px; cursor: pointer; }
.fl-shead .n { width: 18px; height: 18px; border-radius: 50%; background: #27406b; color: #fff; font: 600 11px system-ui, sans-serif; display: flex; align-items: center; justify-content: center; flex: none; }
.fl-shead .t { flex: 1; min-width: 0; font: italic 15px var(--vz-serif); color: #eef2f7; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-shead .t small { display: block; font: 500 11px system-ui, sans-serif; color: var(--vz-dim); overflow: hidden; text-overflow: ellipsis; }
.fl-shead .ok { color: var(--vz-green); font-weight: 700; }
.fl-shead .no { color: var(--vz-red); font-weight: 700; }
.fl-sbody { padding: 6px 9px 9px; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 5px 6px; align-items: center; border-top: 1px solid #222835; }
.fl-sbody > select { width: 100%; min-width: 0; }
.fl-sbody label { color: var(--vz-dim); }
.fl-sbody .row { display: flex; gap: 5px; align-items: center; min-width: 0; }
.fl-sbody .row select { flex: 1; min-width: 0; }
.fl-sbody .err { grid-column: 1 / -1; color: #ff9aa3; line-height: 1.4; overflow-wrap: anywhere; }
.fl-sbody .acts { grid-column: 1 / -1; display: flex; gap: 5px; justify-content: flex-end; }
.fl-add { margin: 2px 8px 12px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---- 3.6: finished steps step back; hover lights one up, a click brings it back */
.fl-plate.away, .fl-plate.away .fl-cell { cursor: pointer; }
.fl-plate.peek { --op: .95 !important; }
.fl-plate.peek .fl-face.front { border-color: var(--vz-blue); box-shadow: 0 0 0 2px rgba(88,196,221,.85), 0 0 34px rgba(88,196,221,.45); }
.fl-plate.peek .fl-title b { color: #dff4fa; }
.fl-view.canpick { cursor: pointer; }
.fl-op { transition: opacity .35s; }
.fl-op.away { opacity: .2; }
.fl-line.rel.away { opacity: .05; }

/* ---- on the stage: back to the map, follow again, steering buttons */
.fl-stage > button, .fl-nav button { font: 500 12.5px system-ui, sans-serif; background: #1b2130e8; color: #dfe5ee; border: 1px solid #36405a; border-radius: 8px; cursor: pointer; }
.fl-stage > button:hover, .fl-nav button:hover { background: #2a3550; border-color: #5b78b8; }
.fl-back { position: absolute; left: 12px; top: 12px; z-index: 6; padding: 6px 12px; display: none; box-shadow: 0 4px 18px #0008; }
.vz-flowwrap.in-part .fl-back { display: block; }
html #vizpanel .fl-back { background: #27406b; border-color: #4c8dff; color: #fff; font-weight: 600; }
.fl-follow { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); z-index: 6; padding: 4px 11px; display: none; }
.vz-flowwrap.steered .fl-follow { display: block; }
.fl-nav { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); z-index: 6; display: flex; flex-direction: column; gap: 4px; opacity: .55; transition: opacity .2s; }
.fl-nav:hover { opacity: 1; }
.fl-nav button { width: 30px; height: 30px; padding: 0; font-size: 15px; line-height: 1; }
.fl-nav i { height: 5px; }
html.touch .fl-nav { opacity: .9; } html.touch .fl-nav button { width: 38px; height: 38px; }
.vz-flowwrap.frozen .fl-view { box-shadow: inset 0 0 0 2px #7fd6ff66, inset 0 0 60px #7fd6ff14; }
.vz-flowwrap.frozen .fl-shead { cursor: zoom-in; }

/* ---- the words under the picture, and your own */
.fl-cap { padding-left: 54px; padding-right: 54px; }
.fl-cap .own { pointer-events: auto; cursor: text; font-size: 21px; color: #fff3c4; white-space: pre-wrap; max-width: 980px; margin: 0 auto 3px; line-height: 1.3; }
.fl-cap .own:hover { text-decoration: underline dotted #f7dc5f88; text-underline-offset: 5px; }
.fl-cap .auto.small { font-size: 14.5px; color: #aeb7c6; }
html #vizpanel .fl-cap .pen { pointer-events: auto; margin-left: 12px; padding: 1px 8px; font: 500 11.5px system-ui, sans-serif; background: #222835; color: #c9d2e0; border: 1px solid #36405a; border-radius: 10px; cursor: pointer; opacity: .6; vertical-align: 2px; }
html #vizpanel .fl-cap .pen:hover { opacity: 1; border-color: #f7dc5f; color: #fff; }
.fl-cap .edit { pointer-events: auto; display: flex; gap: 10px; align-items: flex-start; justify-content: center; }
.fl-cap .edit .k { margin-top: 9px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl-cap textarea, .fl-own textarea { font: 16px var(--vz-serif); background: #0d1119; color: #fff; border: 1px solid #f7dc5f; border-radius: 8px; padding: 6px 9px; resize: vertical; color-scheme: dark; outline: none; }
.fl-cap textarea { width: min(760px, 78%); }
.fl-own { padding: 0 9px 7px 34px; font: italic 13px var(--vz-serif); color: #f1e6b0; cursor: text; white-space: pre-wrap; overflow-wrap: anywhere; }
.fl-own.none { display: none; font: 500 11px system-ui, sans-serif; color: #6f7a8d; }
.fl-step:hover .fl-own.none, .fl-step.now .fl-own.none { display: block; }
.fl-own.none:hover { color: #f7dc5f; }
.fl-own textarea { width: 100%; box-sizing: border-box; font-size: 13.5px; }
.fl-own .edit .k { display: none; }
.fl-sec.live { border-color: var(--vz-yellow); }

/* ---- the program's Buttons, in the visualizer */
.vz-btns { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: #10141c; border-bottom: 1px solid var(--vz-line); overflow-x: auto; flex: none; scrollbar-width: thin; }
#vizpanel.nobtns .vz-btns { display: none; }
.vz-btns .lbl { font: 600 10.5px system-ui, sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--vz-dim); margin-right: 2px; }
.vz-btns .none { font-size: 12px; color: var(--vz-dim); }
html #vizpanel .vz-btns button { background: #18301f; color: #d9f5e3; border: 1px solid #2f6b48; border-radius: 14px; padding: 3px 12px 3px 8px; white-space: nowrap; cursor: pointer; font: inherit; flex: none; }
html #vizpanel .vz-btns button:hover:not(:disabled) { background: #20452c; border-color: #49a36d; }
html #vizpanel .vz-btns button i { font-style: normal; color: #5ee08f; margin-right: 6px; font-size: 10px; }
html #vizpanel .vz-btns button:disabled { opacity: .4; cursor: default; }
html #vizpanel .vz-btns button.run { border-color: #5ee08f; box-shadow: 0 0 0 2px #5ee08f44; animation: vzbtn 1s ease-in-out infinite alternate; }
html #vizpanel .vz-btns button.prep { background: #221e14; border-color: #5a4c2c; color: #d8ccaa; font-size: 11.5px; padding: 2px 9px 2px 7px; }
html #vizpanel .vz-btns button.prep i { color: #c9a95a; }
html #vizpanel .vz-btns button.prepall { background: #2e2615; border-color: #8a7038; color: #f6e7bf; }
html #vizpanel .vz-btns button.prepall i { color: #f0c862; letter-spacing: -2px; margin-right: 8px; }
html #vizpanel .vz-btns button.prepall.run { border-color: #f0c862; box-shadow: 0 0 0 2px #f0c86244; }
.vz-btns .sep { width: 1px; align-self: stretch; background: var(--vz-line); margin: 2px 4px; flex: none; }
html #vizpanel .vz-btns button.stop { background: #3a1c20; border-color: #8a3a44; color: #ffd7d7; padding-left: 10px; }
@keyframes vzbtn { from { box-shadow: 0 0 0 1px #5ee08f33; } to { box-shadow: 0 0 0 4px #5ee08f55; } }
html.touch #vizpanel .vz-btns button { padding: 6px 14px 6px 10px; }

/* ---- the map in space: parts as glass boxes, steps as blocks */
.fl-box, .fl-part, .fl-slab { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; }
.fl-box > i { position: absolute; left: 0; top: 0; display: block; transform-origin: 0 0; box-sizing: border-box; }
.fl-glass > i { background: rgba(190,210,255,.03); border: 2px solid rgba(190,210,255,.2); pointer-events: none; transition: border-color .2s, background .2s; }
.fl-glass > i.far { pointer-events: auto; background: rgba(190,210,255,.045); }
.fl-part { cursor: pointer; }
.fl-part:hover .fl-glass > i { border-color: rgba(200,220,255,.6); background: rgba(190,210,255,.07); }
.fl-part.on .fl-glass > i { border-color: var(--vz-blue); background: rgba(88,196,221,.08); }
.fl-part.live .fl-glass > i { border-color: var(--vz-yellow); background: rgba(247,220,95,.07); }
.fl-part.bad .fl-glass > i { border-color: #b0505c; }
.fl-plabel { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; pointer-events: auto; cursor: pointer; }
.fl-plabel b { display: block; font: 600 62px var(--vz-serif); color: #eef2f7; text-shadow: 0 2px 14px #000; }
.fl-plabel small { display: block; font: 500 34px system-ui, sans-serif; color: #9aa6b8; margin-top: 4px; }
.fl-plabel em { position: absolute; right: -44px; top: 0; font: 700 54px system-ui, sans-serif; color: var(--vz-red); }
.fl-part:hover .fl-plabel b, .fl-part.on .fl-plabel b { color: #fff; }
.fl-part.on .fl-plabel small { color: var(--vz-blue); }
.fl-slab > .fl-box > i { background: #5cd0b3; border: 1px solid #0006; transition: opacity .25s, background .2s; }
.fl-slab.mul > .fl-box > i { background: #58c4dd; }
.fl-slab.move > .fl-box > i { background: #8f98a8; }
.fl-slab.look > .fl-box > i { background: #f7dc5f; }
.fl-slab.bad > .fl-box > i { background: #fc6255; }
.fl-slab > .fl-box > i.sd { box-shadow: inset 0 0 0 999px rgba(0,0,0,.22); }
.fl-slab > .fl-box > i.bk { box-shadow: inset 0 0 0 999px rgba(0,0,0,.34); }
.fl-slab > .fl-box > i.tp { box-shadow: inset 0 0 0 999px rgba(255,255,255,.14); }
.fl-slab.todo > .fl-box > i { opacity: .16; }
.fl-slab.now > .fl-box > i { background: #fff; box-shadow: 0 0 46px #fff; opacity: 1; }
.fl-line.stream { background: #9fb4c9; opacity: .55; height: 6px; margin-top: -3px; }
.fl-line.skip { background: #f7dc5f; opacity: .75; height: 5px; margin-top: -2.5px; }
.fl-line.lead { background: #9aa6b8; opacity: .35; height: 2px; }
html #vizpanel .fl-shead button { padding: 1px 5px; min-width: 0; font-size: 12px; opacity: .75; }
html #vizpanel .fl-shead button:hover { opacity: 1; }
.fl-drawer { width: 256px; }

/* ---- 3.7: numbers only where they can be read; the rest keeps its colours */
.fl-plate[data-far] .fl-cell { font-size: 0; color: transparent; border-radius: 2px; background: rgba(88,196,221, calc(var(--h, 0) * .72 + .06)); transition: none; }
.fl-plate[data-far] .fl-cell.neg { background: rgba(252,98,85, calc(var(--h, 0) * .72 + .06)); }
.fl-plate[data-far] .fl-cell.pend { background: rgba(255,255,255,.04); }
.fl-plate[data-far] .fl-ix, .fl-plate[data-far] .fl-gap { visibility: hidden; }
.fl-part:hover .fl-plabel b, .fl-part.hov .fl-plabel b { color: #fff; }
.fl-part.hov .fl-glass > i { border-color: rgba(200,220,255,.75); background: rgba(190,210,255,.09); }

/* ---- performance mode in the visualizer: flat plates, no glows, nothing animated that doesn't have to be */
#vizpanel.lean .fl-side, #vizpanel.lean .fl-face.back { display: none; }
#vizpanel.lean .fl-cell, #vizpanel.lean .fl-op, #vizpanel.lean .fl-sb { transition: none; }
#vizpanel.lean .fl-cell.src, #vizpanel.lean .fl-cell.hot, #vizpanel.lean .fl-gate, #vizpanel.lean .fl-plate.peek .fl-face.front { box-shadow: 0 0 0 2px var(--vz-blue); }
#vizpanel.lean .fl-cell.hot { box-shadow: 0 0 0 2px var(--vz-yellow); }
#vizpanel.lean .fl-plabel b { text-shadow: none; }
#vizpanel.lean .fl-slab > .fl-box > i.far, #vizpanel.lean .fl-slab.now > .fl-box > i { box-shadow: none; }
#vizpanel.lean .fl-slab > .fl-box > i.far { display: none; }
#vizpanel.lean .fl-view { background: #080b11; }

/* ---- 3.7: pictures and feature maps (a CNN): every number is a pixel */
.fl-pic .fl-face.front { background: #05070b; border-color: rgba(255,255,255,.34); cursor: crosshair; }
.fl-pic.res .fl-face.front { background: #05070b; border-color: rgba(247,220,95,.6); }
.fl-pix { position: absolute; image-rendering: pixelated; image-rendering: crisp-edges; pointer-events: none; }
.fl-pgrid { position: absolute; pointer-events: none; opacity: .5; background-image: linear-gradient(to right, rgba(255,255,255,.09) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,.09) 1px, transparent 1px); }
.fl-pk { position: absolute; width: 0; height: 0; pointer-events: none; }
.fl-plate[data-far] .fl-pgrid { display: none; }
.fl-plate[data-gone] { visibility: hidden; }
.fl-cover { position: absolute; background: rgb(26,30,38); pointer-events: none; }
.fl-cell.best { box-shadow: 0 0 0 2px var(--vz-yellow), 0 0 16px #f7dc5f66; color: #fff; font-weight: 600; }
/* the window that slides over a picture, the place it writes to, and the zeros put around the picture */
.fl-win { position: absolute; left: 0; top: 0; box-sizing: border-box; border: 2.5px solid var(--vz-yellow); border-radius: 2px; background: rgba(247,220,95,.16); box-shadow: 0 0 16px rgba(247,220,95,.6); pointer-events: none; }
.fl-win.one { border-width: 2px; background: rgba(247,220,95,.3); }
.fl-win.row { border-width: 1.5px; border-color: var(--vz-teal); background: rgba(92,208,179,.22); box-shadow: 0 0 12px rgba(92,208,179,.5); }
.fl-ring { position: absolute; left: 0; top: 0; box-sizing: border-box; border-style: solid; border-color: rgba(88,196,221,.2); outline: 1.5px dashed rgba(88,196,221,.75); outline-offset: -1px; pointer-events: none; }
.fl-ring::before { content: 'padding: zeros around the picture'; position: absolute; left: 0; top: 100%; margin: 7px 0 0 -2px; font: italic 13px var(--vz-serif); color: var(--vz-blue); white-space: nowrap; }
.fl-ring.own::before { content: attr(data-what); }
/* YOLO: the grid of cells over the picture, the surest cell, its box and what it is */
.fl-ygrid { position: absolute; pointer-events: none; background-image: linear-gradient(to right, rgba(247,220,95,.42) 1px, transparent 1px), linear-gradient(to bottom, rgba(247,220,95,.42) 1px, transparent 1px); outline: 1px solid rgba(247,220,95,.42); }
.fl-ycell { position: absolute; pointer-events: none; box-sizing: border-box; border: 2px solid rgba(88,196,221,.95); background: rgba(88,196,221,.18); transition: opacity .25s; }
.fl-ybox { position: absolute; pointer-events: none; box-sizing: border-box; border: 2.5px solid #f7dc5f; box-shadow: 0 0 14px rgba(247,220,95,.55); transition: opacity .25s; }
.fl-ybox b { position: absolute; left: -2px; bottom: 100%; margin-bottom: 3px; padding: 1px 7px; border-radius: 5px; background: #f7dc5f; color: #11141b; font: 600 13px var(--vz-serif); white-space: nowrap; }
/* the worked example above the picture */
.fl-lens { position: absolute; left: 0; top: 0; box-sizing: border-box; background: rgba(8,11,18,.95); border: 1px solid rgba(247,220,95,.5); border-radius: 10px; box-shadow: 0 0 34px rgba(247,220,95,.14); font-family: var(--vz-serif); color: #ececec; pointer-events: none; }
.fl-lens .grp { position: absolute; }
.fl-lens .grp small { position: absolute; left: 0; top: 4px; width: 100%; text-align: center; font: 500 12.5px system-ui, sans-serif; color: var(--vz-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-lens .grp.k small { color: var(--vz-teal); }
.fl-lens .grp.p small { color: var(--vz-yellow); }
.fl-lens .c { position: absolute; display: flex; align-items: center; justify-content: center; font: 17px var(--vz-serif); font-variant-numeric: tabular-nums; border-radius: 4px; background: rgba(88,196,221,.14); color: #f1f1f1; }
.fl-lens .c.neg { background: rgba(252,98,85,.2); color: #ffd9d4; }
.fl-lens .grp.k .c { background: rgba(92,208,179,.16); }
.fl-lens .grp.k .c.neg { background: rgba(252,98,85,.2); }
.fl-lens .grp.p .c { background: rgba(247,220,95,.13); }
.fl-lens .grp.p .c.neg { background: rgba(252,98,85,.2); }
.fl-lens .c.best { box-shadow: 0 0 0 2px var(--vz-yellow); color: #fff; }
.fl-lens .op { position: absolute; width: 26px; text-align: center; font: 22px var(--vz-serif); color: #b9c8d6; }
.fl-lens .sum { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 2px; font: 19px var(--vz-serif); white-space: nowrap; }
.fl-lens .sum .sig { font-size: 22px; color: var(--vz-yellow); }
.fl-lens .sum .more { font: italic 15.5px var(--vz-serif); color: #b9c8d6; }
.fl-lens .sum .res b { font-size: 21px; color: var(--vz-yellow); }
#vizpanel.lean .fl-win, #vizpanel.lean .fl-lens { box-shadow: none; }
/* the program's Draw Pad on the Flow stage, and what the network makes of the drawing */
.fl-pad { position: absolute; left: 12px; top: 12px; z-index: 6; width: 196px; background: rgba(13,17,25,.94); border: 1px solid #36405a; border-radius: 10px; box-shadow: 0 6px 24px #000a; color: #dfe5ee; font: 12.5px system-ui, sans-serif; }
.vz-flowwrap.in-part .fl-pad { top: 52px; }
.fl-pad.shut { width: auto; }
.fl-padin { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 7px; }
.fl-pad.shut .fl-padin { padding: 5px 8px; }
.fl-padhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.fl-padhead b { font-weight: 600; color: #fff3c4; }
html #vizpanel .fl-padhead button { min-width: 0; width: 22px; height: 20px; padding: 0; line-height: 1; font-size: 14px; border-radius: 6px; }
.fl-pad .pad { padding: 0; }
.fl-pad .pad-cv { border-color: #f7dc5f99; }
html #vizpanel .fl-pad .pad-tools button { min-width: 0; font-size: 11px; padding: 2px 7px; }
html #vizpanel .fl-pad .pad-tools button.on { background: #2f6f93; border-color: #58c4dd; color: #fff; }
.fl-bars { display: flex; flex-direction: column; gap: 2px; }
.fl-guess { font: 15px var(--vz-serif); color: #cfd6e2; margin: 1px 0 4px; }
.fl-guess b { font: 600 26px var(--vz-serif); color: var(--vz-yellow); margin: 0 2px; }
.fl-bar { display: grid; grid-template-columns: 12px 1fr 44px; align-items: center; gap: 6px; height: 15px; font-variant-numeric: tabular-nums; }
.fl-bar span { font: 600 12px var(--vz-serif); color: #aeb7c6; text-align: center; }
.fl-bar i { height: 9px; background: #1c2230; border-radius: 3px; overflow: hidden; }
.fl-bar u { display: block; height: 100%; background: var(--vz-blue); border-radius: 3px; text-decoration: none; transition: width .12s linear; }
.fl-bar em { font: 11px system-ui, sans-serif; color: #8f9aad; text-align: right; font-style: normal; }
.fl-bar.top span, .fl-bar.top em { color: var(--vz-yellow); }
.fl-bar.top u { background: var(--vz-yellow); }
.fl-bars small, .fl-barnote { font-size: 11px; line-height: 1.35; color: #8f9aad; margin-top: 4px; }
#vizpanel.lean .fl-bar u { transition: none; }
#vizpanel.lean .fl-pad { box-shadow: none; }
html #vizpanel .fl-pad .pad-tools { gap: 3px; }
html #vizpanel .fl-pad .pad-tools button { white-space: nowrap; padding: 2px 5px; font-size: 10.5px; letter-spacing: -.1px; }
/* a 1 × 1 convolution worked out: one row per map */
.fl-lens .rl { position: absolute; display: flex; align-items: center; justify-content: flex-end; font: italic 13.5px var(--vz-serif); color: var(--vz-blue); white-space: nowrap; }
/* a list that is put up again further on: an arc from where it first stood (the way around the steps between: a skip) */
.fl-line.rel.arc { background: var(--vz-yellow); opacity: .5; height: 2px; }
.fl-line.rel.arc.away { opacity: .08; }
/* 3.10: your changes kept on top of what is read from the nodes */
.fl-dacts { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; font-size: 11px; }
.fl-pin { font-size: 10px; }

/* 3.10: the visualizer in a window of its own */
body.vizpop { margin: 0; height: 100vh; overflow: hidden; background: #0d1016; }
#vizpanel.popped { position: fixed; inset: 0; width: auto !important; max-width: none; border-left: none; }
#vizpanel.popped .vz-grip, #vizpanel.popped [title^="Full screen"] { display: none; }


/* ---- 4.5: the node program or the script (Code); the list of steps; holding 1 / 2; the math card; full results */
#vizpanel.src-code .only-nodes, #vizpanel:not(.src-code) .only-code { display: none !important; }
#vizpanel.t-train .only-flow, #vizpanel.t-train .vz-codebar .grad, #vizpanel.t-train .vz-state, #vizpanel.t-train .vz-bar > button:not(.keep), #vizpanel.t-train .vz-bar > select { display: none !important; }
.vz-codebar { display: inline-flex; gap: 6px; align-items: center; }
.vz-codebar .cd-seg { display: inline-flex; border: 1px solid #323a4a; border-radius: 8px; overflow: hidden; }
html #vizpanel .vz-bar .cd-seg button { border: none; border-radius: 0; background: #1a1f2a; color: #aeb7c6; min-width: 0; padding: 3px 10px; }
html #vizpanel .vz-bar .cd-seg button + button { border-left: 1px solid #323a4a; }
html #vizpanel .vz-bar .cd-seg button.on { background: #27406b; color: #fff; }
html #vizpanel .vz-bar .cd-seg.grad button.on[data-k=grad] { background: #4a2a35; color: #ffd0cb; }
html #vizpanel .vz-bar .cd-seg button:disabled { opacity: .4; cursor: default; }
.vz-codeinfo { display: none; }
#vizpanel.src-code .vz-codeinfo { display: block; padding: 5px 12px 6px; background: #10141c; border-bottom: 1px solid var(--vz-line); }
.vz-codeinfo .cd-info { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--vz-dim); min-height: 16px; }
.vz-codeinfo .cd-info b { color: #fff; font-size: 13px; }
.vz-codeinfo .cd-info .loss { color: #f7dc5f; }
.vz-codeinfo .cd-probs b { color: #83c167; font-size: 13px; }
#vizpanel .cd-pane.train { flex: 1; min-height: 0; display: flex; flex-direction: column; }

/* the list of steps: name, the operation, what it means */
.fl-drawer { width: 272px; }
.fl-dhead { padding: 9px 10px 7px; border-bottom: 1px solid #1c2230; margin-bottom: 7px; }
.fl-dhead b { flex: none; }
.fl-dhead .fl-dn { font: 600 11px system-ui, sans-serif; color: #6f7a8d; }
.fl-dhead .grow { flex: 1; }
html #vizpanel .fl-drawer .fl-custom { font-size: 11px; padding: 2px 8px; color: #aeb7c6; border-radius: 10px; }
html #vizpanel .fl-drawer .fl-custom.on { background: #3a3215; border-color: #b8962e; color: #ffe9a8; }
.fl-step { cursor: pointer; transition: border-color .12s, background .12s; }
.fl-step:hover, .fl-step.hov { border-color: #3d4a63; background: #182031; }
.fl-step.now { background: #1c1f1a; }
.fl-step.open { cursor: default; }
.fl-shead { padding: 7px 9px 2px; }
.fl-shead .t { font-style: normal; }
.fl-shead .t b { font: italic 600 15.5px var(--vz-serif); color: #eef2f7; }
.fl-step.now .fl-shead .t b { color: #fff3c4; }
.fl-sop { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 7px; padding: 0 10px 0 34px; }
.fl-sop .o { font: 600 11.5px system-ui, sans-serif; color: var(--vz-teal); white-space: nowrap; }
.fl-sop .f { font: 13px var(--vz-serif); color: #c3cbd8; overflow-wrap: anywhere; }
.fl-sop .cd-ln { font: 500 10.5px system-ui, sans-serif; color: #9fc0ff; cursor: pointer; text-decoration: underline dotted; margin-left: auto; }
.fl-about { padding: 3px 10px 8px 34px; font: 11.5px/1.4 system-ui, sans-serif; color: #8f99aa; }
.fl-about.mine { font: italic 13px/1.35 var(--vz-serif); color: #f1e6b0; }
.fl-step:not(.now) .fl-about { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.fl-step .fl-own { padding: 2px 9px 7px 34px; }
.fl-step.now .fl-sop .o { color: var(--vz-yellow); }

/* the math card: the arithmetic of the moment, flat, top right of the picture */
.fl-math { position: absolute; right: 52px; top: 12px; z-index: 6; max-width: min(540px, calc(100% - 110px)); display: none; padding: 9px 12px 10px; border-radius: 10px;
  background: rgba(10,13,20,.93); border: 1px solid #f7dc5f55; box-shadow: 0 6px 26px #000a; color: #ececec; font: 15px var(--vz-serif); pointer-events: none; }
.fl-math.on { display: block; }
#vizpanel.lean .fl-math { box-shadow: none; }
.vz-flowwrap:has(.fl-pad:not([style*="none"])) .fl-math { max-width: min(540px, calc(100% - 200px)); }
.fl-stage { container-type: inline-size; }
@container (max-width: 760px) {
  .fl-math { padding: 7px 9px 8px; font-size: 13.5px; }
  .fl-math .mc-c { min-width: 0; font-size: 11px; padding: 0 2px; }
  .fl-math .mc-row { gap: 4px; }
  .fl-math .mc-op.big { font-size: 16px; }
}
.fl-math .mc-t { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; font: 500 11px system-ui, sans-serif; color: var(--vz-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-math .mc-t b { font-weight: 700; color: var(--vz-teal); text-transform: uppercase; letter-spacing: .06em; }
.fl-math .mc-eq { line-height: 1.6; overflow-wrap: anywhere; }
.fl-math .mc-row { display: flex; align-items: center; gap: 7px; }
.fl-math .mc-pair { white-space: nowrap; }
.fl-math .mc-x { color: #b9c8d6; margin: 0 3px; }
.fl-math .mc-op { color: #b9c8d6; }
.fl-math .mc-op.big { font-size: 20px; }
.fl-math .mc-gap { color: var(--vz-dim); }
.fl-math .mc-n { color: #e6f4fa; }
.fl-math .mc-n.neg { color: #ffc0b8; }
.fl-math .mc-r { margin-top: 4px; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-math .mc-r b { font-size: 18px; color: var(--vz-yellow); }
.fl-math .mc-r b.neg { color: #ff9c90; }
.fl-math .mc-r small { font: 11px system-ui, sans-serif; color: var(--vz-dim); }
.fl-math .mc-sig { color: var(--vz-yellow); font-size: 18px; margin-right: 3px; }
.fl-math .mc-to { font-style: italic; color: #aeb7c6; }
.fl-math .mc-g { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; }
.fl-math .mc-g small { font: 10px system-ui, sans-serif; color: var(--vz-dim); }
.fl-math .mc-grid { display: inline-grid; gap: 2px; }
.fl-math .mc-c { min-width: 34px; padding: 0 3px; text-align: center; font-size: 12.5px; border-radius: 3px; background: rgba(88,196,221,.14); font-variant-numeric: tabular-nums; }
.fl-math .mc-c.neg { background: rgba(252,98,85,.2); color: #ffd9d4; }
.fl-math .mc-c { white-space: nowrap; }
.fl-math .mc-grid.small .mc-c { min-width: 27px; font-size: 10.5px; padding: 0 2px; }
.fl-math .mc-grid.k .mc-c { background: rgba(92,208,179,.16); }
.fl-math .mc-grid.p .mc-c { background: rgba(247,220,95,.13); }
.fl-math .mc-c.best { box-shadow: 0 0 0 2px var(--vz-yellow); }
.fl-math .mc-line { font-size: 14px; color: #9aa4b4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fl-math .mc-line.last { font-size: 16.5px; color: #fff; }

/* holding 1 / 2: the little bar at the bottom of the picture */
.fl-hud { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 7; display: none; align-items: center; gap: 8px; padding: 4px 6px; border-radius: 20px;
  background: rgba(16,20,28,.94); border: 1px solid #36405a; box-shadow: 0 6px 22px #0009; font: 500 12px system-ui, sans-serif; color: #c9d2e0; user-select: none; }
.vz-flowwrap.manual .fl-hud, .vz-flowwrap.held .fl-hud { display: flex; }
.fl-hud .sc-t { min-width: 150px; text-align: center; white-space: nowrap; font-variant-numeric: tabular-nums; }
.fl-hud.still { border-color: #b8962e; }
.fl-hud.still .sc-t { color: #ffe9a8; }
.fl-hud.moving { border-color: #4c8dff; }
html #vizpanel .fl-hud .sc-b { width: 34px; height: 26px; min-width: 0; padding: 0; border-radius: 14px; background: #222a3a; border: 1px solid #3a4560; color: #fff; font-size: 12px; cursor: pointer; touch-action: none; }
html #vizpanel .fl-hud .sc-b:hover { background: #2c3a58; border-color: #5b78b8; }
html #vizpanel .fl-hud .sc-b:active { background: #27406b; }
.vz-flowwrap.held .fl-view { box-shadow: inset 0 0 0 2px #f7dc5f44; }
.vz-flowwrap.manual .fl-cap, .vz-flowwrap.held .fl-cap { bottom: 42px; }          /* (the little bar has the bottom; the words stand above it) */

/* full results: every number of a step, flat */
.fl-full { position: absolute; inset: 8px; z-index: 12; display: flex; flex-direction: column; background: rgba(9,12,18,.97); border: 1px solid #3a4560; border-radius: 12px; box-shadow: 0 10px 40px #000c; outline: none; user-select: text; -webkit-user-select: text; }
.ff-top { display: flex; align-items: baseline; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--vz-line); }
.ff-top b { font: 600 15px system-ui, sans-serif; color: #fff; }
.ff-top > span { font: italic 15px var(--vz-serif); color: #c3cbd8; }
.ff-top .grow { flex: 1; }
.ff-top small { color: var(--vz-dim); font-size: 11.5px; }
html #vizpanel .ff-top button { background: #222835; color: #dfe5ee; border: 1px solid #323a4a; border-radius: 7px; padding: 2px 9px; cursor: pointer; }
.ff-cols { flex: 1; min-height: 0; overflow: hidden; display: flex; align-items: stretch; gap: 10px; padding: 12px 12px 0; }
.ff-col { display: flex; flex-direction: column; gap: 14px; flex: 1 1 0; min-width: 0; overflow: auto; padding-bottom: 14px; }
.ff-col.w { flex-grow: 1.35; }
.ff-h { font: 700 11px system-ui, sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--vz-dim); }
.ff-op { align-self: center; font: 26px var(--vz-serif); color: var(--vz-teal); white-space: nowrap; padding: 0 2px; flex: none; }
.ff-item { display: flex; flex-direction: column; gap: 5px; }
.ff-lab { display: flex; align-items: baseline; gap: 8px; }
.ff-lab b { font: italic 600 17px var(--vz-serif); color: var(--vz-blue); }
.ff-col:last-child .ff-lab b { color: var(--vz-yellow); }
.ff-lab small { color: var(--vz-dim); font-size: 11px; }
.ff-val { overflow-x: auto; }
.ff-num { border-collapse: separate; border-spacing: 2px; font: 12.5px var(--vz-serif); font-variant-numeric: tabular-nums; }
.ff-num td { padding: 1px 5px; min-width: 38px; text-align: right; border-radius: 3px; color: #eef2f7; }
.ff-num th { font: 500 9.5px system-ui, sans-serif; color: #5d6676; padding: 0 3px; }
.ff-stack { display: flex; flex-wrap: wrap; gap: 8px; }
.ff-stack.pics { gap: 6px; }
.ff-slice { display: flex; flex-direction: column; gap: 2px; padding: 4px; border: 1px solid #1f2633; border-radius: 6px; }
.ff-slice small { font: 10px system-ui, sans-serif; color: var(--vz-dim); }
.ff-pic { image-rendering: pixelated; display: block; border-radius: 3px; border: 1px solid #262c38; }
.ff-one { display: inline-block; padding: 4px 10px; border-radius: 6px; font: 17px var(--vz-serif); }
.ff-err { padding: 30px; color: #ff9aa3; }

/* 4.6 — the working beside a step: the slate (one line per number of a function), and working that faces the camera */
.fl-slate { position: absolute; left: 0; top: 0; min-width: 200px; max-width: 460px; padding: 8px 12px 10px; border-radius: 10px; box-sizing: border-box;
  background: rgba(8,11,18,.95); border: 1px solid rgba(247,220,95,.5); box-shadow: 0 0 34px rgba(247,220,95,.12); color: #ececec; font: 18px var(--vz-serif); pointer-events: none; white-space: nowrap; }
.fl-slate .sl-t { font: 600 13px system-ui, sans-serif; letter-spacing: .05em; color: var(--vz-teal); margin-bottom: 6px; overflow: hidden; text-overflow: ellipsis; max-width: 480px; }
.fl-slate table { border-collapse: collapse; }
.fl-slate td { padding: 2px 6px; line-height: 1.35; }
.fl-slate td.i { color: #9fb0c6; font-style: italic; text-align: right; padding-left: 0; }
.fl-slate td.e { color: #ececec; }
.fl-slate td.q { color: var(--vz-dim); padding: 2px 2px; }
.fl-slate td.r { color: #8be8ff; font-weight: 700; text-align: right; }
.fl-slate td.r.neg { color: #ff9c90; }
.fl-slate.more table::before { content: '⋮'; display: block; color: var(--vz-dim); text-align: center; margin: -4px 0 2px; }

.fl-lens.below .sum { flex-direction: row; flex-wrap: wrap; align-items: center; align-content: center; column-gap: 14px; row-gap: 0; border-top: 1px solid rgba(247,220,95,.22); padding-top: 4px; box-sizing: border-box; }
.fl-lens.below .sum .res { margin-left: auto; }
/* 4.6 — one step on its own: the rest fades away, its plates float into one plane facing the camera */
.fl-plate.fl-glide { transition: transform .95s cubic-bezier(.45,.05,.2,1); }
.fl-world.fl-solo .fl-plate:not(.solo-on) { --op: 0 !important; pointer-events: none; }
.fl-world.fl-solo .fl-plate:not(.solo-on) > * { transition: opacity .55s; }

  /** Display 2D: the same plates, side by side on one flat page, read left to right like an equation — what goes

  // ------------------------------------------------------------ one step on its own

  // ------------------------------------------------------------ small drawing tools

  /** What going back through a step means, in a sentence. */

    if (it.kind === 'pool') return `${f}, backwards: only the biggest number of each window made the result, so the gradient goes back to it — the other three get 0`;

    this.focus([...srcs, out, it.op, { corners: () => [{ x: x0 - 130, y: top - 40, z: zR }, { x: x0 + L + 20, y: rowY(maps.length - 1) + c + gapY, z: zR }] }].filter(Boolean));
    const nTotal = out.n, nMaps = Math.round(nTotal / per);
    this.say('Flatten', `${out.title}: every map is unravelled, row after row, into one long list — map 0 first, then map 1, … up to map ${nMaps - 1}: ${nMaps} × ${per} = ${nTotal} numbers`);
    await C.sleep(500);
    if (!ok()) return;
    const rgb = (P, v) => { const d = [0, 0, 0]; P.colour(v, d, 0); return `rgb(${d[0] | 0},${d[1] | 0},${d[2] | 0})`; };
    const idxOf = (P) => Math.max(0, it.ins.indexOf(P));
    // facing (the default, in 3-D): the ribbons turn to the camera, as the working does, so they are seen whole
    const face = this.facing && !this.flatNow, Pc = { x: x0 + L / 2, y: (rowY(0) + rowY(maps.length - 1)) / 2, z: zR };
    const R = face ? `rotateY(${(-this.cam.ry).toFixed(2)}deg) rotateX(${(-this.cam.rx).toFixed(2)}deg) translateZ(160px)` : '';
    const TP = (p, sc = 1, rot = '', ax = '-50%', ay = '-50%') => `translate3d(${p.x.toFixed(1)}px, ${p.y.toFixed(1)}px, ${p.z.toFixed(1)}px) ${rot} scale(${sc.toFixed(3)}) translate(${ax}, ${ay})`;
    const put = (el, p, ax = '-50%', ay = '-50%') => { el.style.transformOrigin = '0 0'; el.style.transform = TP(face ? turnAbout(Pc, p, this.cam) : p, 1, R, ax, ay); };
    const ribbons = maps.map((P, k) => {
      const cells = [];
      const frame = this.keep(h('i', { class: 'fl-rbframe', style: { width: L + 10 + 'px', height: c + 10 + 'px' } }));
      put(frame, { x: x0 + L / 2, y: rowY(k), z: zR - 1 });
      frame.style.opacity = '0';
      this.world.append(frame);
      for (let i = 0; i < P.n; i++) for (let j = 0; j < P.m; j++) {
        const el = h('i', { class: 'fl-rbc', style: { width: c + 'px', height: c + 'px', background: rgb(P, P.at(i, j)) } });
        const from = P.pos(i, j), flat = { x: x0 + (i * P.m + j + 0.5) * c, y: rowY(k), z: zR }, line = face ? turnAbout(Pc, flat, this.cam) : flat;
        el.style.transformOrigin = '0 0';
        el.style.transform = TP(from, P.S / c);
        this.world.append(el); this.keep(el);
        cells.push({ el, i, j, from, line });
      }
      const lab = this.keep(h('div', { class: 'fl-rblab' }, h('b', {}, `map ${idxOf(P)}`), h('small', {}, `${P.n} rows × ${P.m} → ${per}`)));
      put(lab, { x: x0 - 12, y: rowY(k), z: zR }, '-100%');
      lab.style.opacity = '0';

    });
    // 1. row by row, each map comes apart: its rows slide out, one after another, end to end
    await Promise.all(ribbons.flatMap((r) => r.cells.map((q) => C.anim(q.el, [{ transform: TP(q.from, r.P.S / c) }, { transform: TP(lerp(q.from, q.line, 0.5), (r.P.S / c + 1) / 2) }, { transform: TP(q.line, 1, R) }],
      900, { delay: q.i * 170 + r.k * 120 + q.j * 6 }))).concat(ribbons.flatMap((r) => [C.anim(r.lab, [{ opacity: 0 }, { opacity: 1 }], 400, { delay: 600 }), C.anim(r.frame, [{ opacity: 0 }, { opacity: 1 }], 500, { delay: 400 })])));
    if (!ok()) return;
    // 2. one above the other, with the maps in between left out: ⋮
    const iB = idxOf(B), dotsAt = (y, text) => {
      const d = this.keep(h('div', { class: 'fl-rbdots' }, '⋮', h('small', {}, text)));

    const dl = [];

    if (nMaps > iB + 1) dl.push(dotsAt(rowY(maps.length - 1) + c / 2 + gapY / 2, `map${nMaps - iB > 2 ? `s ${iB + 1} – ${nMaps - 1}` : ` ${iB + 1}`}: the same, on to the end`));
    const dots = dl.length ? dl : null;
    if (dots) await Promise.all(dots.map((d) => C.anim(d, [{ opacity: 0 }, { opacity: 1 }], 380)));
    this.say('Flatten', `map 0 becomes numbers 0 – ${per - 1} of ${out.title}${two ? `; map ${idxOf(B)}, numbers ${idxOf(B) * per} – ${(idxOf(B) + 1) * per - 1}${nMaps > idxOf(B) + 1 ? ' (and the maps after it, on to the end)' : ''}` : ''} — the ribbons pour into the list`);
    await C.sleep(700);
    if (!ok()) return;
    // 3. the ribbons pour into the list: every pixel to its place (the ones in the middle of the list into its ⋮)
    await Promise.all(ribbons.flatMap((r) => r.cells.map((q, n) => {
      const row = idxOf(r.P) * per + n, to = out.pos(row);

        .then(() => { if (out.rows.includes(row)) this.reveal(out, row); });
    })).concat(ribbons.flatMap((r) => [C.anim(r.lab, [{ opacity: 1 }, { opacity: 0 }], 500, { delay: 300 }), C.anim(r.frame, [{ opacity: 1 }, { opacity: 0 }], 500, { delay: 500 })]), dots ? dots.map((d) => C.anim(d, [{ opacity: 1 }, { opacity: 0 }], 500, { delay: 300 })) : []));
    if (!ok()) return;
    this.say('Flatten', `…and so on for every map: ${out.title} holds all ${nTotal} numbers, map after map — the next step reads them as one plain list`);

    if (!ok()) return;

  }
  async playCopy(it, ok) {
    const C = this.clock, all = this.lanes(it), k = it.step.kind, src = it.ins[0], out = it.out;
    if (k === 'flat' && it.ins.length && it.ins.every((p) => p && p.img) && it.ins[0].n * it.ins[0].m <= 400 && out.kind === 'vec') return this.playUnravel(it, ok);
    this.showIns(it);
    this.mark(it);
    this.focus([...this.platesOf(it), it.op]);
    const bare = (p) => p.title.replace(LANE, '');
    this.say(({ rows: 'Positions', last: 'Last row', split: 'Split', merge: 'Merge', cat: 'Join', flat: 'Flatten' })[k] || 'Copy',
      k === 'flat' ? `${out.title}: the maps are unrolled into one long list of ${out.n} numbers — map 0 row by row, then map 1, … The next step treats them as a plain list`
      : k === 'rows' ? `${out.title}: the first ${out.n} rows of ${src.title} — row 0 for the first token, row 1 for the second, …`
        : k === 'last' ? `the last row of ${src.title}: the last token's scores, which say what comes next`
          : k === 'split' ? `${src.title} is dealt out to ${all.length} heads: columns 0 to ${out.m - 1} go to head 0, the next ${out.m} to head 1, … From here every head works on its own, all at the same time`
            : k === 'cat' ? (it.sizes && new Set(it.sizes).size > 1 ? `what the ${it.ins.length} branches worked out is put side by side: ${it.sizes.join(' + ')} = ${it.sizes.reduce((a, b) => a + b, 0)} numbers in one ${src.kind === 'vec' ? 'list' : 'matrix'}` : `what the ${it.ins.length} branches worked out is put side by side: ${it.ins.length} × ${src.kind === 'vec' ? src.n : src.m} columns make one matrix again`)

    await C.sleep(500);
    const one = async (ln, [i, j], n) => {
      await C.sleep(n * 40);

      const s = ln.from(i, j), a = s.p.pos(s.i, s.j), to = ln.out.pos(i, j), v = ln.out.at(i, j);
      s.p.cell(s.i, s.j)?.classList.add('src');

    await Promise.all(all.flatMap((ln, hd) => ln.cells().map((c, n) => one(ln, c, n + hd * 5))));
    if (!ok()) return;
    await C.sleep(500);
  }

  /** Clicked a result: show exactly what made it. */
  async explain(plate, i, j) {
    if (plate._sureOf) return this.explainSure(plate, i, j);
    const it = this.plan.flatMap((x) => this.lanes(x)).find((x) => x.out === plate && x.kind !== 'show' && x.kind !== 'error');

    const gen = await this.halt();
    const ok = () => gen === this.gen;
    if (!ok()) return;
    this.clearTemp();
    this.held = it.lead || it;
    this.chosen = true;
    this.spot(this.held);
    for (const p of this.every) if (p.on) this.revealAll(p);
    this.hooks.onStep?.((it.lead || it).step.id);
    this.hooks.onExplain?.((it.lead || it).step.id);
    plate.cell(i, j)?.classList.add('hot');
    const was = this.clock.instant;
    this.clock.instant = true;
    const at = plate.kind === 'mat' ? `[${i}][${j}]` : plate.kind === 'vec' ? `[${i}]` : '';

        this.keep(this.line(strip.sumPos(), plate.pos(i, j), 'thin resl'));
        const terms = windowOf(pr.K, 3, 1).map((k) => (k < 0 ? '…' : `${fmt(pr.top.v(k))}×${fmt(pr.bot.v(k))}`)).join(' + ');
        this.say('Made from', `${name}${at} = ${terms} = ${fmt(pr.out, 3)}   (${pr.what})`);
        this.focus([...it.ins, plate, strip, it.op].filter(Boolean));
      } else if (it.kind === 'gather') {
        const [table, ids] = it.ins, id = ids.at(i), lab = plate.rowLab?.(i);
        ids.cell(i)?.classList.add('src');
        for (const c of table.shownCols()) table.cell(id, c)?.classList.add('src');
        this.keep(this.line(ids.pos(i), table.pos(id, table.shownCols()[0] ?? 0), 'thin topl'));
        this.keep(this.line(table.pos(id, j), plate.pos(i, j), 'thin resl'));
        this.say('Made from', `${name}${at} = ${table.title}[${id}][${j}] = ${fmt(plate.at(i, j), 3)}   (${ids.title}[${i}] is ${id}${lab ? `, ${lab}` : ''})`);
        this.focus([...it.ins, plate]);
      } else if (it.kind === 'sum') {

        if (cells.length) this.keep(this.line(A.pos(...cells[cells.length - 1]), plate.pos(i, j), 'thin resl'));
        const all = plate.kind === 'num' ? A.n : A.m, terms = cells.slice(0, 4).map(([a, b]) => fmt(A.at(a, b))).join(' + ') + (all > 4 ? ' + …' : '');
        this.say('Made from', `${name}${at} = ${it.step.avg ? `(${terms}) ÷ ${all}` : terms} = ${fmt(plate.at(i, j), 3)}`);
        this.focus([...it.ins, plate, it.op].filter(Boolean));
      } else if (it.kind === 'detect') {
        const d = it.res.det, cp = it.det.sure, g = it.res.ins[0];
        cp.cell(d.row, d.col)?.classList.add('src');
        this.keep(this.line(cp.pos(d.row, d.col), plate.pos(i, j), 'thin resl'));
        const map = it.det.grid[Math.min(5 + i, it.det.grid.length - 1)];
        if (map && 5 + i < it.det.grid.length) { this.makeWindow(map, 1, 1, 'one').moveTo(d.row, d.col); this.keep(this.line(map.pos(d.row, d.col), plate.pos(i, j), 'thin topl')); }
        this.say('Made from', `${name}${at} = the score for ${i} that the surest cell (row ${d.row}, column ${d.col}, ${Math.round(d.box[4] * 100)} % sure) gives: map ${5 + i} of ${inText(it.step.ins[0], this.steps)} at [${d.row}][${d.col}] = ${fmt(g[5 + i][d.row][d.col], 3)}`);

  // ------------------------------------------------------------ the map: the whole calculation as blocks in space
  /** A box with six faces, its near-top-left corner at (x, y, z); it reaches w across, h down and d towards the viewer. */
  cuboid(x, y, z, w, hh, d, cls = '') {
    const px = (v) => v.toFixed(1) + 'px';
    const f = (cw, ch, tf, c) => h('i', { class: c, style: { width: px(cw), height: px(ch), transform: tf } });
    const el = h('div', { class: 'fl-box ' + cls, style: { transform: `translate3d(${px(x)}, ${px(y)}, ${px(z)})` } },
      f(w, hh, 'none', 'bk far'), f(w, hh, `translateZ(${px(d)})`, 'ft'),
      f(d, hh, 'rotateY(-90deg)', 'sd'), f(d, hh, `translateX(${px(w)}) rotateY(-90deg)`, 'sd far'),
      f(w, d, 'rotateX(90deg)', 'tp'), f(w, d, `translateY(${px(hh)}) rotateX(90deg)`, 'tp far'));
    el.box = { x, y, z, w, h: hh, d };
    return el;
  }
  /** Every part of a long calculation as a glass box on one line, each step a block inside it: as long as the
   *  amount of arithmetic it is; branches of a Parallel one above another (branches inside those, side by side);
   *  a step done in several heads at once as that many bars. Yellow arcs: a result picked up again much later. */
  setAtlas(steps, results, secs) {
    this.gen++;
    this.clearAll();
    this.steps = steps;
    this.view.classList.add('atlas');
    const A = this.atlas = { parts: new Map(), slabs: new Map(), secs, results };
    const SX = 330, SY = 300, PADB = 34;
    const widthOf = (s) => { const lg = Math.log10(Math.max(10, results.get(s.id)?.work || 10)); return 4 + 1.15 * lg * lg; };
    // 1. where everything is along the line (in units), and which slice of the cross-section it has
    const cells = [], spans = [];
    const GAP = 2.2, FORK = 3;
    const place = (list, level, a0, r) => {
      let a = a0;
      for (let i = 0; i < list.length;) {
        const s = list[i], pp = s.par?.[level];
        if (!pp) { const w = widthOf(s); cells.push({ s, a, w, r }); a += w + GAP; i++; continue; }
        const br = new Map();
        let j = i;
        for (; j < list.length && list[j].par?.[level]?.[0] === pp[0]; j++) { const b = list[j].par[level][1]; if (!br.has(b)) br.set(b, []); br.get(b).push(list[j]); }
        const B = [...br.values()];
        let end = a;
        B.forEach((b, k) => {
          const sub = level % 2 === 0 ? { ...r, y0: r.y0 + (r.y1 - r.y0) * k / B.length, y1: r.y0 + (r.y1 - r.y0) * (k + 1) / B.length }
            : { ...r, x0: r.x0 + (r.x1 - r.x0) * k / B.length, x1: r.x0 + (r.x1 - r.x0) * (k + 1) / B.length };
          end = Math.max(end, place(b, level + 1, a + FORK, sub));
        });
        a = end + FORK;
        i = j;
      }
      return a;
    };
    let at = 0;
    for (const name of secs) {
      const mine = steps.filter((s) => s.sec === name);
      const a0 = at;
      at = place(mine, 0, at, { x0: 0, x1: 1, y0: 0, y1: 1 }) - GAP;
      spans.push({ name, a0, a1: at, n: mine.length, work: mine.reduce((t, s) => t + (results.get(s.id)?.work || 0), 0) });
      at += 16;
    }
    const total = Math.max(1, at - 16), K = clamp(5200 / total, 2.5, 18);
    const all = spans.reduce((t, sp) => t + sp.work, 0) || 1;
    const Z = (a) => (a - total / 2) * K;
    // 2. the parts
    for (const sp of spans) {
      const z0 = Z(sp.a0) - PADB, d = (sp.a1 - sp.a0) * K + 2 * PADB;
      const bad = steps.some((s) => s.sec === sp.name && (results.get(s.id)?.err || results.get(s.id)?.check?.ok === false));
      const glass = this.cuboid(-SX / 2 - PADB, -SY / 2 - PADB, z0, SX + 2 * PADB, SY + 2 * PADB, d, 'fl-glass');
      const share = Math.round(100 * sp.work / all);
      const label = h('div', { class: 'fl-plabel' }, h('b', {}, sp.name), h('small', {}, `${sp.n} step${sp.n === 1 ? '' : 's'} · ${share < 1 ? 'under 1' : share}% of the arithmetic`), bad ? h('em', {}, '!') : null);
      const ly = -SY / 2 - PADB - 120 - 130 * (A.parts.size % 2);          // names take turns at two heights, so neighbours don't run into each other
      label.style.transform = `translate3d(0px, ${ly.toFixed(1)}px, ${(z0 + d / 2).toFixed(1)}px) var(--bb, none) translate(-50%, -100%)`;
      const el = h('div', { class: 'fl-part' + (bad ? ' bad' : '') }, glass, label);
      this.line({ x: 0, y: ly + 6, z: z0 + d / 2 }, { x: 0, y: -SY / 2 - PADB, z: z0 + d / 2 }, 'lead');
      el._sec = sp.name;
      const part = { el, name: sp.name, z0, z1: z0 + d, corners: () => [{ x: -SX / 2 - PADB, y: -SY / 2 - PADB - 360, z: z0 }, { x: SX / 2 + PADB, y: SY / 2 + PADB, z: z0 + d }] };
      A.parts.set(sp.name, part);
      this.world.append(el);
    }
    // 3. the steps
    const KIND = { matvec: 'mul', matmul: 'mul', dot: 'mul', rowdot: 'mul', conv: 'mul', map: 'fn', norm: 'fn', pool: 'fn', gather: 'look', rows: 'move', last: 'move', split: 'move', merge: 'move', cat: 'move', flat: 'move', transpose: 'move', show: 'move' };
    for (const c of cells) {
